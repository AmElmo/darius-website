<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Darius CTA Background Proposals</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #100D09;
    --ink: #0D0B08;
    --bone: #ECE7DD;
    --bone-dim: #BDB5A7;
    --line: rgba(236, 231, 221, 0.1);
    --sapphire: #5C8AFF;
    --sapphire-soft: #9FB1FF;
    --jade: #71B7A1;
    --ember: #D49563;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--bone);
    font-family: Manrope, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    line-height: 1.4;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 20;
    opacity: 0.022;
    mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/></svg>");
  }
  .page {
    display: grid;
    gap: 1px;
    background: var(--line);
  }
  .proposal {
    position: relative;
    min-height: 760px;
    overflow: hidden;
    isolation: isolate;
    display: grid;
    place-items: center;
    padding: 104px 28px;
    background: var(--bg);
  }
  .proposal::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: -1;
    background:
      linear-gradient(180deg, rgba(255,255,255,0.035), transparent 24%, transparent 74%, rgba(0,0,0,0.24)),
      radial-gradient(ellipse 86% 32% at 50% 105%, rgba(236, 231, 221, 0.055), transparent 68%);
  }
  .stage {
    position: relative;
    z-index: 2;
    display: grid;
    justify-items: center;
    text-align: center;
    width: min(100%, 1100px);
  }
  .label {
    margin-bottom: 42px;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: rgba(236, 231, 221, 0.52);
  }
  h1 {
    font-size: clamp(58px, 9.2vw, 132px);
    font-weight: 300;
    line-height: 0.96;
    letter-spacing: 0;
    text-wrap: balance;
  }
  h1 span {
    color: var(--sapphire);
  }
  .cta-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    min-width: min(430px, 100%);
    min-height: 78px;
    margin-top: 52px;
    padding: 20px 40px;
    border-radius: 999px;
    background: var(--bone);
    color: var(--ink);
    font-size: clamp(22px, 3vw, 32px);
    font-weight: 400;
    text-decoration: none;
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.74),
      0 20px 60px -28px rgba(236,231,221,0.55);
  }
  .cta-btn svg {
    width: 22px;
    height: 22px;
    flex: 0 0 auto;
  }

  .liquid {
    background:
      linear-gradient(180deg, #13100C 0%, #0F0C08 100%);
  }
  .liquid::before {
    content: "";
    position: absolute;
    inset: -24%;
    z-index: -2;
    background:
      linear-gradient(112deg, transparent 12%, rgba(92,138,255,0.15) 25%, transparent 38%),
      linear-gradient(128deg, transparent 42%, rgba(212,149,99,0.13) 53%, transparent 66%),
      linear-gradient(88deg, transparent 58%, rgba(113,183,161,0.1) 70%, transparent 84%),
      linear-gradient(180deg, #14110D, #0D0A07);
    background-size: 145% 145%, 170% 170%, 150% 150%, 100% 100%;
    filter: blur(18px) saturate(120%);
    animation: liquidDrift 16s ease-in-out infinite alternate;
  }
  .liquid .stage::before,
  .liquid .stage::after {
    content: "";
    position: absolute;
    left: 50%;
    width: min(900px, 86vw);
    height: 1px;
    transform: translateX(-50%);
    background: linear-gradient(90deg, transparent, rgba(236,231,221,0.22), transparent);
  }
  .liquid .stage::before { top: -72px; }
  .liquid .stage::after { bottom: -84px; opacity: 0.55; }

  .glass {
    background:
      linear-gradient(180deg, #110F0D 0%, #0B0A08 100%);
  }
  .glass::before {
    content: "";
    position: absolute;
    inset: -34%;
    z-index: -2;
    background:
      conic-gradient(from 228deg at 50% 52%,
        rgba(92,138,255,0.22),
        rgba(236,231,221,0.05),
        rgba(113,183,161,0.12),
        rgba(212,149,99,0.09),
        rgba(92,138,255,0.22));
    filter: blur(34px) saturate(135%);
    animation: glassTurn 24s linear infinite;
  }
  .glass .blade {
    position: absolute;
    inset: 0;
    z-index: -1;
    opacity: 0.7;
    background:
      linear-gradient(115deg, transparent 0 36%, rgba(255,255,255,0.08) 43%, transparent 52%),
      linear-gradient(115deg, transparent 0 52%, rgba(92,138,255,0.10) 58%, transparent 67%);
    transform: translateX(-12%);
    animation: glassSweep 9s ease-in-out infinite alternate;
  }
  .glass h1 span {
    background: linear-gradient(135deg, #D9E0FF 0%, #5C8AFF 64%, #3159D8 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .field {
    background:
      linear-gradient(180deg, #100E0B 0%, #0C0A08 100%);
  }
  .field::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: -2;
    background:
      linear-gradient(rgba(236,231,221,0.042) 1px, transparent 1px),
      linear-gradient(90deg, rgba(236,231,221,0.035) 1px, transparent 1px),
      linear-gradient(135deg, rgba(92,138,255,0.1), transparent 36%, rgba(212,149,99,0.08) 62%, transparent);
    background-size: 72px 72px, 72px 72px, 160% 160%;
    transform-origin: 50% 58%;
    transform: perspective(900px) rotateX(58deg) scale(1.25);
    animation: fieldSlide 18s linear infinite;
  }
  .field .rail {
    position: absolute;
    inset: auto -10% 18%;
    z-index: -1;
    height: 26%;
    background:
      linear-gradient(90deg, transparent, rgba(92,138,255,0.13), rgba(236,231,221,0.08), rgba(113,183,161,0.1), transparent);
    filter: blur(28px);
    transform: skewY(-4deg);
    animation: railBreathe 8s ease-in-out infinite alternate;
  }

  @keyframes liquidDrift {
    from { transform: translate3d(-2%, 1%, 0) scale(1.02); background-position: 0% 30%, 80% 40%, 30% 70%, 0 0; }
    to { transform: translate3d(2%, -2%, 0) scale(1.05); background-position: 95% 42%, 20% 55%, 86% 34%, 0 0; }
  }
  @keyframes glassTurn {
    to { transform: rotate(1turn); }
  }
  @keyframes glassSweep {
    from { transform: translateX(-16%); opacity: 0.42; }
    to { transform: translateX(16%); opacity: 0.78; }
  }
  @keyframes fieldSlide {
    from { background-position: 0 0, 0 0, 0% 50%; }
    to { background-position: 0 144px, 144px 0, 100% 50%; }
  }
  @keyframes railBreathe {
    from { opacity: 0.48; transform: skewY(-4deg) translateY(8px); }
    to { opacity: 0.82; transform: skewY(-4deg) translateY(-6px); }
  }

  @media (max-width: 720px) {
    .proposal {
      min-height: 620px;
      padding: 72px 24px;
    }
    .label {
      margin-bottom: 30px;
      font-size: 10px;
    }
    h1 {
      font-size: clamp(48px, 15vw, 72px);
    }
    .cta-btn {
      min-height: 62px;
      margin-top: 34px;
      padding: 16px 24px;
      font-size: 22px;
    }
    .cta-btn svg {
      width: 18px;
      height: 18px;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.001ms !important;
      animation-iteration-count: 1 !important;
      scroll-behavior: auto !important;
    }
  }
</style>
</head>
<body>
<main class="page">
  <section class="proposal liquid">
    <div class="stage">
      <div class="label">Proposal 01 · Liquid graphite</div>
      <h1>Try <span>Darius</span> now.</h1>
      <a href="https://github.com/AmElmo/darius-updates/releases/latest/download/Darius.dmg" class="cta-btn">
        Download for macOS
        <svg viewBox="0 0 16 16" fill="none"><path d="M8 2v9m0 0l-3.5-3.5M8 11l3.5-3.5M3 14h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
    </div>
  </section>

  <section class="proposal glass">
    <div class="blade"></div>
    <div class="stage">
      <div class="label">Proposal 02 · Sapphire glass</div>
      <h1>Try <span>Darius</span> now.</h1>
      <a href="https://github.com/AmElmo/darius-updates/releases/latest/download/Darius.dmg" class="cta-btn">
        Download for macOS
        <svg viewBox="0 0 16 16" fill="none"><path d="M8 2v9m0 0l-3.5-3.5M8 11l3.5-3.5M3 14h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
    </div>
  </section>

  <section class="proposal field">
    <div class="rail"></div>
    <div class="stage">
      <div class="label">Proposal 03 · Spatial field</div>
      <h1>Try <span>Darius</span> now.</h1>
      <a href="https://github.com/AmElmo/darius-updates/releases/latest/download/Darius.dmg" class="cta-btn">
        Download for macOS
        <svg viewBox="0 0 16 16" fill="none"><path d="M8 2v9m0 0l-3.5-3.5M8 11l3.5-3.5M3 14h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
    </div>
  </section>
</main>
</body>
</html>
