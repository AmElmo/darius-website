<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Darius — Almost there</title>
<link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #14110D;
    --bg-2: #1B1813;
    --panel: #1E1A14;
    --panel-2: #25201A;
    --line: rgba(236, 231, 221, 0.07);
    --line-2: rgba(236, 231, 221, 0.11);
    --bone: #ECE7DD;
    --bone-dim: #C7C0B3;
    --ash: #837C70;
    --ember: #D49563;
    --sapphire: #7F92FF;
    --jade: #6CB39A;
    --nav-bg: rgba(20, 17, 13, 0.7);
    --ghost-bg: rgba(236, 231, 221, 0.04);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); }
  body {
    font-family: 'Manrope', -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--bone);
    -webkit-font-smoothing: antialiased;
    line-height: 1.55;
    overflow-x: hidden;
    font-feature-settings: "ss01", "cv11";
    min-height: 100vh;
  }
  body::before {
    content: ""; position: fixed; inset: 0;
    pointer-events: none; z-index: 200;
    opacity: 0.022; mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/></svg>");
  }
  .mono { font-family: 'JetBrains Mono', monospace; }

  nav {
    position: sticky; top: 0; z-index: 50;
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    background: var(--nav-bg);
    border-bottom: 1px solid var(--line);
  }
  .nav-inner {
    display: flex; align-items: center; justify-content: space-between;
    padding: 22px 28px; max-width: 1100px; margin: 0 auto;
  }
  .brand { display: flex; align-items: center; gap: 6px; text-decoration: none; color: var(--bone); }
  .brand svg { width: 36px; height: 36px; }
  .brand-name { font-weight: 600; font-size: 21px; letter-spacing: 0.16em; text-transform: uppercase; }
  .nav-status {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 7px 12px; border-radius: 999px;
    background: var(--ghost-bg); border: 1px solid var(--line-2);
    font-size: 12px; color: var(--bone-dim);
    font-family: 'JetBrains Mono', monospace;
  }
  .nav-status .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--jade); box-shadow: 0 0 12px rgba(108,179,154,0.6);
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.45; } }

  /* hero */
  .stage {
    position: relative;
    max-width: 1040px;
    margin: 0 auto;
    padding: 88px 28px 48px;
    text-align: center;
  }
  .stage::before {
    content: ""; position: absolute;
    inset: 80px 5% 0 5%;
    background:
      radial-gradient(ellipse 50% 60% at 50% 60%, rgba(212, 149, 99, 0.20) 0%, transparent 65%),
      radial-gradient(ellipse 45% 55% at 25% 80%, rgba(127, 146, 255, 0.16) 0%, transparent 65%),
      radial-gradient(ellipse 40% 50% at 80% 70%, rgba(108, 179, 154, 0.10) 0%, transparent 65%);
    filter: blur(70px); pointer-events: none; z-index: 0;
  }
  .stage > * { position: relative; z-index: 1; }

  h1 {
    font-weight: 600;
    font-size: clamp(36px, 5vw, 60px);
    line-height: 1.02; letter-spacing: -0.035em;
    margin-bottom: 12px;
  }
  h1 em {
    font-style: normal;
    background: linear-gradient(135deg, #9FB1FF 0%, #5C8AFF 60%, #3B5FBF 100%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .sub {
    font-size: 16px; color: var(--bone-dim);
    max-width: 480px; margin: 0 auto;
  }

  /* the window illustration */
  .window {
    position: relative;
    margin: 52px auto 0;
    max-width: 760px;
    aspect-ratio: 16 / 10;
    border-radius: 14px;
    background: linear-gradient(180deg, #2A241B 0%, #1B1813 100%);
    border: 1px solid var(--line-2);
    box-shadow:
      0 60px 120px -30px rgba(0,0,0,0.7),
      0 80px 160px -40px rgba(212, 149, 99, 0.18),
      0 60px 140px -30px rgba(127, 146, 255, 0.12);
    overflow: hidden;
  }
  .win-bar {
    height: 30px;
    display: flex; align-items: center; gap: 7px;
    padding: 0 14px;
    background: linear-gradient(180deg, rgba(60, 52, 42, 0.9), rgba(40, 34, 26, 0.9));
    border-bottom: 1px solid rgba(0,0,0,0.4);
    position: relative;
  }
  .win-bar .dot { width: 11px; height: 11px; border-radius: 50%; }
  .win-bar .r { background: #ed6a5e; }
  .win-bar .y { background: #f5bf4f; }
  .win-bar .g { background: #61c554; }
  .win-bar .title {
    position: absolute; left: 50%; transform: translateX(-50%);
    font-size: 12px; color: var(--bone-dim);
    font-weight: 500;
  }
  .win-body {
    position: relative;
    height: calc(100% - 30px);
    display: flex; align-items: center; justify-content: center;
    gap: clamp(60px, 12vw, 140px);
    padding: 0 8%;
    background:
      radial-gradient(ellipse 60% 60% at 50% 50%, rgba(212, 149, 99, 0.05) 0%, transparent 70%),
      linear-gradient(180deg, #1A1611, #14110D);
  }

  /* App icon */
  .app-icon {
    position: relative;
    width: clamp(96px, 14vw, 148px);
    aspect-ratio: 1;
    border-radius: 24%;
    background: linear-gradient(160deg, #2B241B 0%, #1A1612 70%);
    border: 1px solid rgba(255,255,255,0.06);
    display: inline-flex; align-items: center; justify-content: center;
    box-shadow:
      0 30px 50px -15px rgba(0,0,0,0.7),
      0 10px 25px -8px rgba(212,149,99,0.25),
      inset 0 1px 0 rgba(255,255,255,0.08);
    z-index: 3;
    animation: float 4s ease-in-out infinite;
  }
  .app-icon::before {
    content: ""; position: absolute; inset: -2px;
    border-radius: 26%;
    background: linear-gradient(160deg, rgba(212,149,99,0.4), rgba(127,146,255,0.3) 60%, transparent 80%);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude;
    padding: 1px;
    pointer-events: none;
  }
  .app-icon svg { width: 64%; height: 64%; color: var(--sapphire); }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }

  /* arrow */
  .arrow {
    position: absolute;
    left: 50%; top: calc(50% + 15px);
    transform: translate(-50%, -50%);
    width: clamp(80px, 14vw, 160px);
    z-index: 2;
  }
  .arrow svg { width: 100%; height: auto; display: block; overflow: visible; }
  .arrow .dash {
    stroke-dasharray: 4 6;
    animation: dash 1.6s linear infinite;
  }
  @keyframes dash { to { stroke-dashoffset: -20; } }

  /* folder */
  .folder {
    position: relative;
    width: clamp(100px, 15vw, 156px);
    z-index: 3;
  }
  .folder svg {
    width: 100%; height: auto;
    filter: drop-shadow(0 20px 30px rgba(0,0,0,0.6)) drop-shadow(0 8px 16px rgba(78,120,200,0.25));
  }

  /* meta strip below */
  .meta {
    margin-top: 56px;
    display: flex; align-items: center; justify-content: center;
    gap: 36px;
    flex-wrap: wrap;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12.5px;
    color: var(--bone-dim);
  }
  .meta .step { display: inline-flex; align-items: center; gap: 10px; }
  .meta .step .n {
    width: 22px; height: 22px;
    border-radius: 6px;
    background: var(--ghost-bg);
    border: 1px solid var(--line-2);
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 11px; color: var(--bone);
  }
  .meta .step strong { color: var(--bone); font-weight: 500; letter-spacing: 0.02em; }
  .meta .sep { color: var(--ash-2, var(--ash)); opacity: 0.4; }

  .req {
    margin-top: 40px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11.5px;
    color: var(--ash);
    letter-spacing: 0.04em;
  }

  footer {
    margin-top: 80px;
    padding: 28px;
    border-top: 1px solid var(--line);
    text-align: center;
    color: var(--ash);
    font-size: 11.5px;
    font-family: 'JetBrains Mono', monospace;
    letter-spacing: 0.04em;
  }
  @media (max-width: 580px) {
    .meta { gap: 14px; }
    .meta .sep { display: none; }
  }
</style>
</head>
<body>

<svg style="display:none" aria-hidden="true">
  <symbol id="darius-mark" viewBox="0 0 200 200">
    <g fill="none" stroke="currentColor" stroke-linejoin="round" stroke-linecap="round">
      <path stroke-width="5.27" d="M 46.49 29.06 L 153.51 90.85 C 160.56 94.91 160.56 105.09 153.51 109.15 L 46.49 170.94 C 39.45 175.01 30.64 169.92 30.64 161.78 L 30.64 38.22 C 30.64 30.08 39.45 25.00 46.49 29.06 Z"/>
      <path stroke-width="4.30" d="M 100 140 L 30.64 100 L 100 60 Z"/>
      <path stroke-width="3.13" d="M 65.31 120 L 65.31 80 L 100 100 Z"/>
    </g>
  </symbol>
</svg>

<nav>
  <div class="nav-inner">
    <a class="brand" href="../../index.html">
      <svg><use href="#darius-mark"/></svg>
      <span class="brand-name">DARIUS</span>
    </a>
    <span class="nav-status"><span class="dot"></span>Downloading</span>
  </div>
</nav>

<main class="stage">
  <h1>Drag Darius<br>to <em>Applications.</em></h1>
  <p class="sub">That's it. Open the .dmg from your Downloads, drag the icon across, and launch.</p>

  <div class="window" role="img" aria-label="Install window showing the Darius app being dragged to the Applications folder.">
    <div class="win-bar">
      <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
      <span class="title">Install Darius</span>
    </div>
    <div class="win-body">
      <div class="app-icon">
        <svg viewBox="0 0 200 200"><use href="#darius-mark"/></svg>
      </div>

      <div class="arrow" aria-hidden="true">
        <svg viewBox="0 0 160 40" fill="none">
          <defs>
            <linearGradient id="ag" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0%" stop-color="#D49563" stop-opacity="0.2"/>
              <stop offset="50%" stop-color="#D49563" stop-opacity="0.9"/>
              <stop offset="100%" stop-color="#7F92FF" stop-opacity="0.9"/>
            </linearGradient>
          </defs>
          <path class="dash" d="M2 20 L 138 20" stroke="url(#ag)" stroke-width="2.5" stroke-linecap="round"/>
          <path d="M 130 8 L 152 20 L 130 32" stroke="#7F92FF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        </svg>
      </div>

      <div class="folder" aria-hidden="true">
        <svg viewBox="0 0 160 130" fill="none">
          <defs>
            <linearGradient id="fg1" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#9FBAE8"/>
              <stop offset="100%" stop-color="#4E78C8"/>
            </linearGradient>
            <linearGradient id="fg2" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#B0C7EE"/>
              <stop offset="100%" stop-color="#5E88D8"/>
            </linearGradient>
          </defs>
          <!-- back tab -->
          <path d="M14 30 Q 14 22 22 22 L 62 22 L 76 36 L 146 36 Q 154 36 154 44 L 154 110 Q 154 118 146 118 L 22 118 Q 14 118 14 110 Z"
                fill="url(#fg1)" stroke="rgba(0,0,0,0.25)" stroke-width="0.6"/>
          <!-- front face -->
          <path d="M14 50 Q 14 42 22 42 L 146 42 Q 154 42 154 50 L 154 110 Q 154 118 146 118 L 22 118 Q 14 118 14 110 Z"
                fill="url(#fg2)" stroke="rgba(0,0,0,0.18)" stroke-width="0.6"/>
          <!-- subtle "A" letter for Applications -->
          <text x="84" y="92" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-size="32" font-weight="700" fill="rgba(255,255,255,0.55)">A</text>
        </svg>
      </div>
    </div>
  </div>

  <div class="meta">
    <span class="step"><span class="n">1</span><strong>Open the .dmg</strong></span>
    <span class="sep">·</span>
    <span class="step"><span class="n">2</span><strong>Drag to Applications</strong></span>
    <span class="sep">·</span>
    <span class="step"><span class="n">3</span><strong>Launch</strong></span>
  </div>

  <p class="req">macOS 15.5+ · Apple Silicon · Free during beta</p>
</main>

<footer>© 2026 DARIUS · v0.19.0-BETA.6 · APPLE SILICON</footer>

</body>
</html>
