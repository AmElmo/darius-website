<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Darius Changelog</title>
<meta name="description" content="Latest Darius releases, improvements, and fixes." />
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
<link rel="alternate icon" href="assets/favicon-32.png" type="image/png" sizes="32x32" />
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
<script defer src="https://cloud.umami.is/script.js" data-website-id="c4ca1e12-6665-4b73-a849-aa3917d0f575"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #14110D;
    --bg-2: #1B1813;
    --panel: #1E1A14;
    --panel-2: #25201A;
    --line: rgba(236, 231, 221, 0.07);
    --line-2: rgba(236, 231, 221, 0.11);
    --bone: #ECE7DD;
    --bone-dim: #C7C0B3;
    --ash: #837C70;
    --ash-2: #5C564C;
    --ember: #D49563;
    --sapphire: #7F92FF;
    --sapphire-deep: #5C8AFF;
    --jade: #6CB39A;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; background: var(--bg); }
  body {
    font-family: 'Manrope', -apple-system, BlinkMacSystemFont, sans-serif;
    background:
      radial-gradient(ellipse 80% 46% at 50% -10%, rgba(92, 138, 255, 0.14), transparent 58%),
      linear-gradient(180deg, var(--bg) 0%, #100E0B 100%);
    color: var(--bone);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    line-height: 1.55;
    overflow-x: hidden;
    font-feature-settings: "ss01", "cv11";
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 200;
    opacity: 0.022;
    mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/></svg>");
  }

  .mono { font-family: 'JetBrains Mono', monospace; }

  nav {
    position: sticky;
    top: 0;
    z-index: 50;
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    background: rgba(20, 17, 13, 0.72);
    border-bottom: 1px solid var(--line);
  }
  .nav-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 22px 28px;
    max-width: 1100px;
    margin: 0 auto;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 6px;
    text-decoration: none;
    color: #FFFFFF;
  }
  .brand svg { width: 38px; height: 38px; }
  .brand-name {
    font-weight: 600;
    font-size: 22px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
  }
  .nav-actions { display: flex; align-items: center; gap: 26px; }
  .nav-link {
    color: var(--bone-dim);
    font-size: 12.5px;
    font-weight: 600;
    text-decoration: none;
    transition: color 200ms ease-out;
  }
  .nav-link:hover,
  .nav-link[aria-current="page"] { color: var(--bone); }
  .nav-cta {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--bone);
    color: var(--bg);
    padding: 7px 14px;
    border-radius: 7px;
    font-size: 12.5px;
    font-weight: 600;
    text-decoration: none;
    transition: opacity 200ms ease-out;
  }
  .nav-cta:hover { opacity: 0.9; }
  .nav-cta .apple-logo { width: 11px; height: 13px; margin-top: -1px; flex: 0 0 auto; }

  .page-head {
    max-width: 1100px;
    margin: 0 auto;
    padding: 84px 28px 24px;
  }
  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    color: var(--ash);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    margin-bottom: 22px;
  }
  .eyebrow::before {
    content: "";
    width: 6px;
    height: 6px;
    border-radius: 999px;
    background: var(--sapphire);
    box-shadow: 0 0 18px rgba(127, 146, 255, 0.9);
  }
  h1 {
    font-size: clamp(40px, 6.2vw, 72px);
    font-weight: 400;
    letter-spacing: 0;
    line-height: 0.98;
  }
  .changelog-shell {
    display: grid;
    grid-template-columns: 180px minmax(0, 1fr);
    gap: 56px;
    max-width: 1100px;
    margin: 0 auto;
    padding: 18px 28px 112px;
  }
  .release-rail {
    position: sticky;
    top: 96px;
    align-self: start;
    display: grid;
    gap: 10px;
  }
  .release-rail a {
    display: grid;
    gap: 3px;
    padding: 10px 0 10px 14px;
    border-left: 1px solid var(--line-2);
    color: var(--ash);
    text-decoration: none;
    transition: color 160ms ease-out, border-color 160ms ease-out;
  }
  .release-rail a:hover,
  .release-rail a.is-active {
    color: var(--bone);
    border-left-color: var(--sapphire);
  }
  .release-rail strong {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    font-weight: 500;
  }
  .release-rail span {
    font-size: 12px;
  }

  .release-list { display: grid; gap: 80px; }
  .release {
    scroll-margin-top: 110px;
    padding-bottom: 76px;
    border-bottom: 1px solid var(--line);
  }
  .release:last-child {
    border-bottom: 0;
    padding-bottom: 0;
  }
  .release-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    margin-bottom: 18px;
    color: var(--ash);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .release-pill {
    border: 1px solid rgba(127, 146, 255, 0.28);
    background: rgba(127, 146, 255, 0.08);
    color: #AEBBFF;
    border-radius: 999px;
    padding: 4px 9px;
  }
  .release h2 {
    max-width: 760px;
    font-size: clamp(30px, 4vw, 52px);
    font-weight: 400;
    line-height: 1.05;
    letter-spacing: 0;
  }
  .release-intro {
    max-width: 700px;
    margin-top: 18px;
    color: var(--bone-dim);
    font-size: 16.5px;
    line-height: 1.62;
  }
  .shot-frame {
    margin: 30px 0 34px;
  }
  .shot-label {
    display: block;
    margin-bottom: 10px;
    color: var(--ash);
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .shot-frame img {
    display: block;
    width: 100%;
    height: auto;
    border: 1px solid var(--line-2);
    border-radius: 12px;
    box-shadow:
      0 36px 90px -46px rgba(0,0,0,0.76),
      0 44px 110px -70px rgba(92,138,255,0.5);
  }
  .shot-placeholder {
    min-height: 340px;
    border: 1px solid var(--line-2);
    border-radius: 12px;
    box-shadow:
      0 36px 90px -46px rgba(0,0,0,0.76),
      0 44px 110px -70px rgba(92,138,255,0.5);
    background:
      linear-gradient(rgba(236,231,221,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(236,231,221,0.035) 1px, transparent 1px),
      linear-gradient(135deg, rgba(92,138,255,0.14), transparent 42%, rgba(212,149,99,0.12));
    background-size: 44px 44px, 44px 44px, 100% 100%;
  }
  .release-sections {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 28px 34px;
  }
  .release-section h3 {
    margin-bottom: 12px;
    color: var(--bone);
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.02em;
  }
  .release-section ul {
    display: grid;
    gap: 9px;
    list-style: none;
  }
  .release-section li {
    position: relative;
    padding-left: 18px;
    color: var(--bone-dim);
    font-size: 14px;
    line-height: 1.55;
  }
  .release-section li::before {
    content: "";
    position: absolute;
    top: 0.72em;
    left: 0;
    width: 5px;
    height: 5px;
    border-radius: 999px;
    background: rgba(127, 146, 255, 0.82);
  }

  footer {
    border-top: 1px solid var(--line);
    padding: 28px;
  }
  .footer-meta {
    max-width: 1100px;
    margin: 0 auto;
    display: flex;
    justify-content: space-between;
    font-size: 11.5px;
    color: var(--ash);
    align-items: center;
    letter-spacing: 0.03em;
  }
  footer .brand { gap: 8px; }
  footer .brand svg { width: 16px; height: 16px; }
  footer .brand-name { font-size: 11px; letter-spacing: 0.18em; }

  @media (max-width: 860px) {
    .nav-actions { gap: 14px; }
    .nav-link:not([aria-current="page"]) { display: none; }
    .page-head { padding-top: 62px; }
    .changelog-shell {
      display: block;
      padding-bottom: 84px;
    }
    .release-rail {
      position: relative;
      top: auto;
      display: flex;
      overflow-x: auto;
      gap: 0;
      margin-bottom: 44px;
      padding-bottom: 8px;
    }
    .release-rail a {
      min-width: 142px;
      border-left: 0;
      border-bottom: 1px solid var(--line-2);
      padding: 10px 14px;
    }
    .release-rail a:hover,
    .release-rail a.is-active {
      border-left-color: transparent;
      border-bottom-color: var(--sapphire);
    }
    .release-list { gap: 62px; }
    .release { padding-bottom: 58px; }
    .release-sections { grid-template-columns: 1fr; }
    .shot-frame { border-radius: 10px; }
    .shot-placeholder { min-height: 260px; }
    .footer-meta { flex-direction: column; gap: 14px; align-items: flex-start; }
  }
</style>
</head>
<body>

<svg width="0" height="0" style="position: absolute;">
  <defs>
    <symbol id="darius-mark-white" viewBox="0 0 200 200">
      <g fill="none" stroke="#FFFFFF" stroke-linejoin="round" stroke-linecap="round">
        <path stroke-width="5.27" d="M 46.49 29.06 L 153.51 90.85 C 160.56 94.91 160.56 105.09 153.51 109.15 L 46.49 170.94 C 39.45 175.01 30.64 169.92 30.64 161.78 L 30.64 38.22 C 30.64 30.08 39.45 25.00 46.49 29.06 Z"/>
        <path stroke-width="4.30" d="M 100 140 L 30.64 100 L 100 60 Z"/>
        <path stroke-width="3.13" d="M 65.31 120 L 65.31 80 L 100 100 Z"/>
      </g>
    </symbol>
  </defs>
</svg>

<nav>
  <div class="nav-inner">
    <a class="brand" href="../">
      <svg><use href="#darius-mark-white"/></svg>
      <span class="brand-name">DARIUS</span>
    </a>
    <div class="nav-actions">
      <a href="./" class="nav-link" aria-current="page">Changelog</a>
      <a href="../roadmap/" class="nav-link">Roadmap</a>
      <a href="https://github.com/AmElmo/darius-updates/releases/download/0.19.0-beta.6/Darius-0.19.0-beta.6.dmg" class="nav-cta" data-darius-download>
        <svg class="apple-logo" viewBox="0 0 16 20" fill="currentColor" aria-hidden="true"><path d="M13.06 10.53c-.02-2.06 1.68-3.05 1.76-3.1-.96-1.4-2.45-1.59-2.98-1.62-1.27-.13-2.48.74-3.12.74-.65 0-1.65-.72-2.71-.7-1.39.02-2.68.81-3.39 2.06-1.45 2.51-.37 6.22 1.04 8.27.69 1 1.51 2.13 2.58 2.09 1.04-.04 1.43-.67 2.69-.67 1.25 0 1.61.67 2.71.65 1.12-.02 1.83-1.02 2.51-2.02.79-1.16 1.12-2.28 1.14-2.34-.03-.01-2.18-.84-2.2-3.32zM11.04 4.55c.58-.7.97-1.67.86-2.64-.83.03-1.84.55-2.43 1.25-.53.62-.99 1.6-.87 2.55.92.07 1.86-.47 2.44-1.16z"/></svg>
        Download
      </a>
    </div>
  </div>
</nav>

<header class="page-head">
  <span class="eyebrow">Product changelog</span>
</header>

<main class="changelog-shell" aria-busy="true">
  <aside class="release-rail" id="releaseRail" aria-label="Release navigation"></aside>
  <div class="release-list" id="releaseList"></div>
</main>

<footer>
  <div class="footer-meta">
    <a class="brand" href="../">
      <svg><use href="#darius-mark-white"/></svg>
      <span class="brand-name">DARIUS</span>
    </a>
    <span>&copy; 2026 Darius &middot; macOS 15.5+ &middot; Made on Apple Silicon</span>
  </div>
</footer>

<script>
  const CHANGELOG_FEED_URL = 'https://amelmo.github.io/darius-updates/changelog.json';
  const CHANGELOG_FEED_BASE = 'https://amelmo.github.io/darius-updates/';
  const CHANGELOG_FALLBACK = {
    schemaVersion: 1,
    releases: [
      {
        version: '0.19.0-beta.5',
        date: '2026-05-05',
        channel: 'beta',
        title: 'The first public Darius beta.',
        summary: 'This release turns the private Darius fork into a downloadable beta: signed app builds, Darius-owned update infrastructure, mandatory sign-in, refreshed branding, and the first pass at the new workspace UI.',
        image: {
          url: '../assets/darius-hero-screen.png',
          alt: 'Darius workspace preview',
          label: 'Release screenshot',
        },
        sections: [
          {
            title: 'Highlights',
            items: [
              'Shipped the first public beta release through the Darius update repository.',
              'Added mandatory Supabase sign-in for release builds.',
              'Adopted the Darius three-triangles brand mark across the app and website.',
              'Added the menu bar quick ask panel for fast access from macOS.',
            ],
          },
          {
            title: 'Improvements',
            items: [
              'Refined the task sidebar, chat canvas, settings surfaces, and onboarding copy.',
              'Bundled the plugin catalog and binaries inside the app for a simpler beta setup.',
              'Added screenshot seed data and a UI catalog to make future visual review easier.',
            ],
          },
          {
            title: 'Fixes',
            items: [
              'Fixed release signing issues around Developer ID Apple OAuth.',
              'Fixed Metal toolchain setup in the release workflow.',
              'Excluded Icon Composer source from the release app target.',
            ],
          },
          {
            title: 'Infrastructure',
            items: [
              'Moved release assets, appcast, sandbox URLs, and update hosting to Darius-owned infrastructure.',
              'Added upstream intake guardrails so Osaurus-owned hosts do not re-enter Darius releases.',
            ],
          },
        ],
      },
    ],
  };

  const escapeHtml = (value) => String(value ?? '').replace(/[&<>"']/g, (char) => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;',
  }[char]));

  const slugForVersion = (version) => `release-${String(version).toLowerCase().replace(/[^a-z0-9]+/g, '-')}`;

  const formatDate = (value) => {
    const date = new Date(`${value}T00:00:00Z`);
    if (Number.isNaN(date.getTime())) return value || '';
    return new Intl.DateTimeFormat('en-US', {
      month: 'long',
      day: 'numeric',
      year: 'numeric',
      timeZone: 'UTC',
    }).format(date);
  };

  const resolveAssetUrl = (url, baseUrl) => {
    if (!url) return '';
    if (/^https?:\/\//.test(url) || !baseUrl) return url;
    return new URL(url.replace(/^\/+/, ''), baseUrl).toString();
  };

  const renderImage = (image, baseUrl) => {
    if (!image) return '';
    const src = resolveAssetUrl(image.url, baseUrl);
    if (!src) return '';

    return `
      <figure class="shot-frame">
        ${image.label ? `<figcaption class="shot-label">${escapeHtml(image.label)}</figcaption>` : ''}
        <img src="${escapeHtml(src)}" alt="${escapeHtml(image.alt || '')}" loading="lazy" />
      </figure>
    `;
  };

  const renderSections = (sections = []) => sections
    .filter((section) => section && section.title && Array.isArray(section.items) && section.items.length)
    .map((section) => `
      <section class="release-section">
        <h3>${escapeHtml(section.title)}</h3>
        <ul>
          ${section.items.map((item) => `<li>${escapeHtml(item)}</li>`).join('')}
        </ul>
      </section>
    `)
    .join('');

  const renderChangelog = (feed, baseUrl = '') => {
    const releases = Array.isArray(feed.releases) ? feed.releases : [];
    if (!releases.length) return false;

    const rail = document.getElementById('releaseRail');
    const list = document.getElementById('releaseList');
    if (!rail || !list) return false;

    rail.innerHTML = releases.map((release) => `
      <a href="#${slugForVersion(release.version)}">
        <strong>${escapeHtml(release.version)}</strong>
        <span>${escapeHtml(formatDate(release.date))}</span>
      </a>
    `).join('');

    list.innerHTML = releases.map((release) => `
      <article class="release" id="${slugForVersion(release.version)}">
        <div class="release-meta">
          <span>${escapeHtml(release.version)}</span>
          <span>${escapeHtml(formatDate(release.date))}</span>
          ${release.channel ? `<span class="release-pill">${escapeHtml(release.channel)}</span>` : ''}
        </div>
        <h2>${escapeHtml(release.title)}</h2>
        ${release.summary ? `<p class="release-intro">${escapeHtml(release.summary)}</p>` : ''}
        ${renderImage(release.image, baseUrl)}
        <div class="release-sections">
          ${renderSections(release.sections)}
        </div>
      </article>
    `).join('');

    bindReleaseScrollSpy();
    document.querySelector('.changelog-shell')?.setAttribute('aria-busy', 'false');
    return true;
  };

  let releaseSpyCleanup = null;
  const bindReleaseScrollSpy = () => {
    if (releaseSpyCleanup) releaseSpyCleanup();

    const railLinks = Array.from(document.querySelectorAll('#releaseRail a[href^="#"]'));
    const articles = railLinks
      .map((link) => document.getElementById(decodeURIComponent(link.getAttribute('href').slice(1))))
      .filter(Boolean);
    if (!articles.length) return;

    const setActive = (id) => {
      railLinks.forEach((link) => {
        link.classList.toggle('is-active', link.getAttribute('href') === `#${id}`);
      });
    };

    const update = () => {
      const probe = window.innerHeight * 0.28;
      let current = articles[0].id;
      for (const article of articles) {
        if (article.getBoundingClientRect().top - probe <= 0) {
          current = article.id;
        } else {
          break;
        }
      }
      const nearBottom = window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 4;
      if (nearBottom) current = articles[articles.length - 1].id;
      setActive(current);
    };

    window.addEventListener('scroll', update, { passive: true });
    window.addEventListener('resize', update);
    update();

    releaseSpyCleanup = () => {
      window.removeEventListener('scroll', update);
      window.removeEventListener('resize', update);
    };
  };

  fetch(CHANGELOG_FEED_URL, { cache: 'no-store' })
    .then((response) => response.ok ? response.json() : Promise.reject(response.status))
    .then((feed) => {
      if (!renderChangelog(feed, CHANGELOG_FEED_BASE)) {
        renderChangelog(CHANGELOG_FALLBACK, '');
      }
    })
    .catch(() => {
      renderChangelog(CHANGELOG_FALLBACK, '');
    });

  (() => {
    const buttons = document.querySelectorAll('a[data-darius-download]');
    if (!buttons.length) return;
    const apply = (url) => buttons.forEach(el => { el.href = url; });

    try {
      const cached = JSON.parse(localStorage.getItem('darius-dl') || 'null');
      if (cached && Date.now() - cached.t < 3600_000) {
        apply(cached.url);
        return;
      }
    } catch {}

    fetch('https://api.github.com/repos/AmElmo/darius-updates/releases?per_page=1')
      .then(r => r.ok ? r.json() : Promise.reject(r.status))
      .then(([release]) => {
        const asset = release && (
          release.assets.find(a => /^Darius-.+\.dmg$/.test(a.name)) ||
          release.assets.find(a => a.name === 'Darius.dmg')
        );
        if (!asset) return;
        apply(asset.browser_download_url);
        try { localStorage.setItem('darius-dl', JSON.stringify({ t: Date.now(), url: asset.browser_download_url })); } catch {}
      })
      .catch(() => {});
  })();
</script>

</body>
</html>
